{% extends "base.html" %}
{% block title %}登录 · 众仁{% endblock %}
{% block content %}
<section class="auth-card"><p class="eyebrow">欢迎回来</p><h1>欢迎回来，<br>继续您的旅程。</h1><p class="muted">登录后即可购买额度套餐并查看兑换码。</p>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}{% include "ui/field.html" %}{% endfor %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="zr-button--primary full" type="submit">登录 {% include "ui/icon.html" with name="arrow-right" %}</button></form>
<p class="auth-footer">还没有账号？ <a href="{% url 'signup' %}">创建账号</a></p></section>
{% endblock %}
