{% extends "base.html" %}
{% block title %}创建账号 · 众仁{% endblock %}
{% block content %}
<section class="auth-card"><p class="eyebrow">开启新旅程</p><h1>与众仁一起，<br>开启新的可能。</h1><p class="muted">创建账号，统一保存和查看您的兑换码。</p>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}{% include "ui/field.html" %}{% endfor %}<button class="zr-button--primary full" type="submit">创建账号 {% include "ui/icon.html" with name="arrow-right" %}</button></form>
<p class="auth-footer">已有账号？ <a href="{% url 'login' %}">登录</a></p></section>
{% endblock %}
