{% extends "base.html" %}
{% block title %}Log in · ZrenAI{% endblock %}
{% block content %}
<section class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Pick up where<br>you left off.</h1><p class="muted">Log in to buy tokens and view your codes.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="button full" type="submit">Log in →</button></form>
<p class="auth-footer">New here? <a href="{% url 'signup' %}">Create an account</a></p></section>
{% endblock %}
