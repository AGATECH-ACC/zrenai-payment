<dialog id="store-help" aria-labelledby="store-help-title">
  <div class="zr-panel-head"><h2 id="store-help-title">从选购到兑换，只需三步。</h2><button type="button" class="zr-button--ghost" data-close-dialog aria-label="关闭购买指南">{% include "ui/icon.html" with name="x" %}</button></div>
  <ol class="instruction-list"><li><strong>选择套餐</strong><p>每笔订单包含所选套餐的一个专属兑换码。</p></li><li><strong>完成支付</strong><p>商店确认支付成功后，将交付兑换码。</p></li><li><strong>打开购买记录</strong><p>复制已交付的兑换码，在对应服务中兑换使用。</p></li></ol>
  <div class="zr-alert zr-alert--info">已经付款？请先查看订单状态，避免重复支付。</div>
  <div class="dialog-actions"><button class="zr-button--primary" type="button" data-close-dialog>知道了</button></div>
</dialog>
