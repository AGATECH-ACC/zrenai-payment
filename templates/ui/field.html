<div class="zr-field{% if field.errors %} has-error{% endif %}">
  {{ field.label_tag }}{{ field }}
  {% if field.help_text %}<div class="zr-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {% if field.errors %}<div class="zr-error">{{ field.errors }}</div>{% endif %}
</div>
